{% extends "base.html" %}

{% block title %}Delete category | Smart Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-3">Delete category</h1>
    <p>Delete the category <strong>{{ category.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a class="btn btn-link" href="{% url 'category_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
