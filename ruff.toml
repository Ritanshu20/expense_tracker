target-version = "py312"
line-length = 100

[lint]
# E/F: pycodestyle and pyflakes, I: import order, B: likely bugs, UP: modern Python syntax.
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# Migration files are generated by Django, so their line length and import order are left alone.
"**/migrations/*.py" = ["E501", "I001"]
